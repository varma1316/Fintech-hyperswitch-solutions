name: Terraform CD Apply

on:
  push:
    branches:
      - master
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/cd-apply.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          TF_BUCKET=$(echo -n "${{ secrets.TF_STATE_BUCKET }}" | tr -d '[:space:]')
          terraform init -backend-config="bucket=${TF_BUCKET}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve
          aws eks update-kubeconfig --region us-east-1 --name hyperswitch-cluster
          kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=90s || true
          sleep 20

      - name: Diagnostic Dump to diag branch
        if: always()
        run: |
          aws eks update-kubeconfig --region us-east-1 --name hyperswitch-cluster
          cd ..
          {
            echo "=== KUBERNETES NAMESPACES ==="
            kubectl get ns
            echo ""
            echo "=== ALL SERVICES ==="
            kubectl get svc -A
            echo ""
            echo "=== ALL PODS ==="
            kubectl get pods -A -o wide
            echo ""
            echo "=== ALL INGRESSES ==="
            kubectl get ingress -A
            echo ""
            echo "=== TARGET GROUP BINDINGS ==="
            kubectl get targetgroupbindings -A || true
            echo ""
            echo "=== DESCRIBE GRAFANA INGRESS ==="
            kubectl describe ingress -n monitoring grafana-ingress || true
            echo ""
            echo "=== DESCRIBE HYPERSWITCH INGRESS ==="
            kubectl describe ingress -n hyperswitch hyperswitch-ingress || true
            echo ""
            echo "=== AWS LOAD BALANCER CONTROLLER LOGS ==="
            kubectl logs -n kube-system deployment/aws-load-balancer-controller --tail=150 || true
            echo ""
            echo "=== ALB HTTP RESPONSE TEST ==="
            curl -Iv --max-time 10 http://k8s-hyperswitchplatfo-e76b9467f2-2059119029.us-east-1.elb.amazonaws.com/grafana/ || true
          } > diag.txt
          cat diag.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B diag
          git add diag.txt
          git commit -m "chore: cluster diagnostics dump [skip ci]" || true
          git push -f origin diag || true




