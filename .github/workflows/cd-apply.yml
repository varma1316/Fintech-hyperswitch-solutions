name: Terraform CD Apply

on:
  push:
    branches:
      - master
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/cd-apply.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          TF_BUCKET=$(echo -n "${{ secrets.TF_STATE_BUCKET }}" | tr -d '[:space:]')
          terraform init -backend-config="bucket=${TF_BUCKET}"

      - name: Prepare StatefulSet Upgrade
        run: |
          aws eks update-kubeconfig --region us-east-1 --name hyperswitch-cluster
          kubectl delete statefulset -n monitoring prometheus-kube-prometheus-stack-prometheus loki --cascade=orphan || true

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve

      - name: Cluster Status Verification
        if: always()
        run: |
          aws eks update-kubeconfig --region us-east-1 --name hyperswitch-cluster
          echo "=== PODS ==="
          kubectl get pods -A
          echo "=== PERSISTENT VOLUME CLAIMS ==="
          kubectl get pvc -A
          echo "=== STORAGE CLASSES ==="
          kubectl get sc
          echo "=== INGRESSES ==="
          kubectl get ingress -A
          echo "=== ALB GRAFANA HEALTH ==="
          curl -Iv --max-time 10 http://k8s-hyperswitchplatfo-e76b9467f2-2059119029.us-east-1.elb.amazonaws.com/grafana/ || true




