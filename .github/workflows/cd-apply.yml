name: Terraform CD Apply

on:
  push:
    branches:
      - master
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/cd-apply.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          TF_BUCKET=$(echo -n "${{ secrets.TF_STATE_BUCKET }}" | tr -d '[:space:]')
          terraform init -backend-config="bucket=${TF_BUCKET}"

      - name: Prepare Storage and StatefulSets
        run: |
          aws eks update-kubeconfig --region us-east-1 --name hyperswitch-cluster
          kubectl apply -f ../k8s/monitoring/storageclass.yaml || true
          kubectl delete pod -n monitoring loki-0 tempo-0 prometheus-kube-prometheus-stack-prometheus-0 --force --grace-period=0 || true
          kubectl delete statefulset -n monitoring prometheus-kube-prometheus-stack-prometheus loki tempo --cascade=orphan || true

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve 2>&1 | tee /tmp/tf_apply.log

      - name: Cluster Status Verification
        if: always()
        run: |
          aws eks update-kubeconfig --region us-east-1 --name hyperswitch-cluster
          cd ..
          {
            echo "=== TERRAFORM OUTPUT (LAST 150 LINES) ==="
            cat /tmp/tf_apply.log | tail -n 150 || true
            echo ""
            echo "=== EKS ADDONS ==="
            aws eks list-addons --cluster-name hyperswitch-cluster || true
            aws eks describe-addon --cluster-name hyperswitch-cluster --addon-name aws-ebs-csi-driver || true
            echo ""
            echo "=== PODS ==="
            kubectl get pods -A
            echo ""
            echo "=== PERSISTENT VOLUME CLAIMS ==="
            kubectl get pvc -A
            echo ""
            echo "=== STORAGE CLASSES ==="
            kubectl get sc
            echo ""
            echo "=== PROMETHEUS POD EVENTS ==="
            kubectl describe pod -n monitoring prometheus-kube-prometheus-stack-prometheus-0 | tail -n 30 || true
            echo ""
            echo "=== LOKI POD LOGS / EVENTS ==="
            kubectl describe pod -n monitoring loki-0 | tail -n 30 || true
            kubectl logs -n monitoring loki-0 --tail=30 || true
            echo ""
            echo "=== TEMPO POD LOGS / EVENTS ==="
            kubectl describe pod -n monitoring tempo-0 | tail -n 30 || true
            kubectl logs -n monitoring tempo-0 --tail=30 || true
            echo ""
            echo "=== INGRESSES ==="
            kubectl get ingress -A
            echo ""
            echo "=== ALB GRAFANA HEALTH ==="
            curl -Iv --max-time 10 http://k8s-hyperswitchplatfo-e76b9467f2-2059119029.us-east-1.elb.amazonaws.com/grafana/ || true
          } > diag.txt
          cat diag.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B diag
          git add diag.txt
          git commit -m "chore: cluster diagnostics dump [skip ci]" || true
          git push -f origin diag || true




