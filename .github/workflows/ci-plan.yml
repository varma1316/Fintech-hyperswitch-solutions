name: Terraform CI Plan

on:
  pull_request:
    branches:
      - master
    paths:
      - 'terraform/**'
      - '.github/workflows/ci-plan.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC Token & Claims
        run: |
          echo "=== GitHub Context Info ==="
          echo "Repository: ${{ github.repository }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"

          echo "=== Inspecting GitHub OIDC Token Claims ==="
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            JWT_RAW=$(curl -sLS -H "User-Agent: actions/oidc-client" \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')

            if [ -n "$JWT_RAW" ] && [ "$JWT_RAW" != "null" ]; then
              echo "OIDC Token retrieved successfully from GitHub Actions runtime."
              PAYLOAD=$(echo "$JWT_RAW" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)
              echo "Decoded Claims (Payload):"
              echo "$PAYLOAD" | jq '{iss, aud, sub, repository, repository_owner, event_name, ref}'
            else
              echo "Warning: Unable to fetch OIDC token from internal endpoint."
            fi
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_URL or token is empty. Ensure 'permissions: id-token: write' is set."
          fi
          echo "==========================================="

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Format Check
        run: |
          terraform fmt -check

      - name: Terraform Plan
        run: |
          terraform plan -no-color
