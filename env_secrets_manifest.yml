# Environment & Secrets Manifest for Hyperswitch E-Commerce Platform

# 1. Custom Backend Microservices
auth-service:
  - PORT
  - JWT_SECRET
  - DATABASE_URL # (PostgreSQL users & credentials)

product-service:
  - PORT
  - DATABASE_URL # (Optional for dynamic catalog)

cart-service:
  - PORT
  - REDIS_URL # (Optional for distributed session carts)

order-service:
  - PORT
  - ORDER_DB_URL # (PostgreSQL ecommerce_orders)
  - HYPERSWITCH_SERVER_URL
  - HYPERSWITCH_API_KEY
  - SNS_PAYMENT_SUCCESS_TOPIC_ARN
  - AWS_REGION
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY

inventory-service:
  - PORT
  - SQS_INVENTORY_QUEUE_URL
  - AWS_REGION
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY

notification-service:
  - PORT
  - SQS_NOTIFICATION_QUEUE_URL
  - SMTP_SERVER
  - SMTP_PORT
  - SMTP_USERNAME
  - SMTP_PASSWORD
  - SENDER_EMAIL
  - AWS_REGION
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY

# 2. Frontend Applications (S3 / CDN Hosted)
ecommerce-storefront:
  - VITE_HYPERSWITCH_PUBLISHABLE_KEY
  - VITE_ORDER_SERVICE_URL
  - VITE_PRODUCT_SERVICE_URL
  - VITE_CART_SERVICE_URL
  - VITE_AUTH_SERVICE_URL
  - VITE_RUM_ENDPOINT # (For Real User Monitoring / Tracing telemetry)
  - VITE_ENABLE_RUM

hyperswitch-control-center:
  - ENV_BACKEND_URL
  - ENABLE_LOGGING
  - SDK_ENV

hyperswitch-web:
  - HYPERSWITCH_PUBLISHABLE_KEY
  - HYPERSWITCH_CLIENT_URL
  - HYPERSWITCH_SERVER_URL

# 3. Hyperswitch Core Backend (Deploy via Juspay Upstream Helm Chart)
hyperswitch-helm-values:
  - hyperswitch.router.replicaCount
  - hyperswitch.scheduler.producer.replicaCount
  - hyperswitch.scheduler.consumer.replicaCount
  - hyperswitch.drainer.replicaCount
  - postgresql.auth.password
  - redis.auth.password



  
