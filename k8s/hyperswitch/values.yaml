# ==============================================================================
# Helm Values for Hyperswitch Core Router (hyperswitch-app v1.3.1)
# Configured to use AWS RDS PostgreSQL and Amazon ElastiCache Redis.
#
# IMPORTANT: Dynamic infrastructure values (hosts, usernames, database names)
# are injected by Terraform "set" blocks in helm_release.hyperswitch.
# The placeholder values below are overridden at deploy time.
# ==============================================================================

# ------------------------------------------------------------------------------
# Disable all sub-charts — AWS managed services are used instead
# ------------------------------------------------------------------------------
postgresql:
  enabled: false

redis:
  enabled: false

kafka:
  enabled: false

clickhouse:
  enabled: false

mailhog:
  enabled: false

vector:
  enabled: false

superposition:
  enabled: false

hyperswitch-card-vault:
  enabled: false

hyperswitch-ucs:
  enabled: false

# ------------------------------------------------------------------------------
# External PostgreSQL (AWS RDS)
# Hosts and credentials are injected by Terraform set blocks.
# Password is read from the hyperswitch-secrets Kubernetes Secret.
# ------------------------------------------------------------------------------
externalPostgresql:
  enabled: true
  primary:
    host: "hyperswitch-postgres"
    auth:
      username: "postgresadmin"
      database: "hyperswitch"
      password:
        _secretRef:
          name: hyperswitch-secrets
          key: DB_PASSWORD
  readOnly:
    enabled: false
    host: "hyperswitch-postgres"
    auth:
      username: "postgresadmin"
      database: "hyperswitch"
      password:
        _secretRef:
          name: hyperswitch-secrets
          key: DB_PASSWORD

# ------------------------------------------------------------------------------
# External Redis (Amazon ElastiCache)
# Points to hyperswitch-redis ExternalName Kubernetes Service
# ------------------------------------------------------------------------------
externalRedis:
  enabled: true
  host: "hyperswitch-redis"
  auth:
    enabled: false

# ------------------------------------------------------------------------------
# Initialization and Miscellaneous
# ------------------------------------------------------------------------------
redisMiscConfig:
  checkRedisIsUp:
    initContainer:
      enable: false

initDB:
  enable: false

# ------------------------------------------------------------------------------
# Server Configuration Overrides
# Override chart default ClickHouse password secretRef to use our existing
# hyperswitch-secrets instead of the non-existent 'clickhouse' secret.
# ------------------------------------------------------------------------------
server:
  configs:
    analytics:
      clickhouse:
        password:
          _secretRef:
            name: hyperswitch-secrets
            key: DB_PASSWORD
