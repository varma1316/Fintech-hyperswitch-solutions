# ==============================================================================
# Helm Values for Grafana Loki (SingleBinary / Lightweight cluster mode)
# Retention: 7h | Volume: 5Gi gp3 EBS
# ==============================================================================

deploymentMode: SingleBinary
revision: "v2"

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  compactor:
    retention_enabled: true
    delete_request_cancel_period: 0m
  limits_config:
    retention_period: 7h
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp3

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
gateway:
  enabled: false

test:
  enabled: false
