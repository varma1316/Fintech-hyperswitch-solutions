# ==============================================================================
# Helm Values for Grafana Tempo Distributed / Standalone Tracing
# ==============================================================================

tempo:
  repository: grafana/tempo
  tag: "2.9.0"
  retention: 7h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP

persistence:
  enabled: true
  size: 5Gi
  storageClassName: gp3
