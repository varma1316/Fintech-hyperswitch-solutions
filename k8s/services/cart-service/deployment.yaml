apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: cart-service
  labels:
    app: cart-service
    app.kubernetes.io/part-of: hyperswitch-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: 690998797903.dkr.ecr.us-east-1.amazonaws.com/hyperswitch/cart-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
              name: http
          env:
            - name: PORT
              value: "4003"
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: app-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 5
