apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cart-service-secrets
  namespace: cart-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: hyperswitch/infra
        property: REDIS_URL
