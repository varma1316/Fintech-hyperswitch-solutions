apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: order-service
  labels:
    app: order-service
    app.kubernetes.io/part-of: hyperswitch-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 690998797903.dkr.ecr.us-east-1.amazonaws.com/hyperswitch/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service.inventory-service.svc.cluster.local:8001"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service.notification-service.svc.cluster.local:8002"
          envFrom:
            - secretRef:
                name: app-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
