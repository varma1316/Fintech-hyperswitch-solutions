apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: order-service-secrets
  namespace: order-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: hyperswitch/infra
        property: DATABASE_URL
    - secretKey: ORDER_DB_URL
      remoteRef:
        key: hyperswitch/infra
        property: ORDER_DB_URL
    - secretKey: AWS_REGION
      remoteRef:
        key: hyperswitch/infra
        property: AWS_REGION
    - secretKey: HYPERSWITCH_SERVER_URL
      remoteRef:
        key: hyperswitch/infra
        property: HYPERSWITCH_SERVER_URL
    - secretKey: HYPERSWITCH_API_KEY
      remoteRef:
        key: hyperswitch/infra
        property: HYPERSWITCH_API_KEY
    - secretKey: SNS_PAYMENT_SUCCESS_TOPIC_ARN
      remoteRef:
        key: hyperswitch/infra
        property: SNS_PAYMENT_SUCCESS_TOPIC_ARN
